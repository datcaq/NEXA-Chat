spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexa}
    username: ${DATABASE_USER:nexa}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      enabled: false
server:
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 256KB
    connection-timeout: 20s
