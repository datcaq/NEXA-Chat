services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexa
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexa-group01-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  nexa-group01-postgres:
